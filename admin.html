<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Netboot Portal — Admin Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<!-- SheetJS Engine for Master .xlsx layout exports -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#0f172a;
    --slate:#475569;
    --slate-soft:#94a3b8;
    --cloud:#eef2f7;
    --card:#ffffff;
    --line:#e2e8f0;
    --signal:#2563eb;
    --signal-dark:#1d4ed8;
    --teal:#0d9488;
    --emerald:#059669;
    --amber:#d97706;
    --rose:#dc2626;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: 'Plus Jakarta Sans', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html, body{ height:100dvh; margin:0; overflow:hidden; }
  body{ background:var(--cloud); font-family:var(--sans); color:var(--ink); display:flex; flex-direction:column; }

  /* This console has its own top bar (below) — the shared site header/footer
     from common.js would otherwise eat most of the viewport height and
     squash the table into a tiny scroll box. Hide them on this page. */
  #headerPlaceholder, #footerPlaceholder{ display:none !important; }

  /* ---------- Console top bar ---------- */
  .console-bar{
    flex:0 0 auto;
    background:var(--ink);
    color:#fff;
    padding:9px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
  }
  .console-brand{ display:flex; align-items:center; gap:8px; font-weight:800; font-size:13px; letter-spacing:.2px; }
  .console-brand .dot{ width:7px; height:7px; border-radius:50%; background:var(--emerald); box-shadow:0 0 0 3px rgba(5,150,105,.25); }
  .console-stats{ display:flex; gap:8px; }
  .console-chip{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
    padding:4px 10px;
    border-radius:999px;
    font-size:10.5px;
    font-weight:600;
    color:#cbd5e1;
    display:flex; align-items:center; gap:5px;
  }
  .console-chip b{ color:#fff; font-family:var(--mono); font-weight:600; }
  .console-actions{ display:flex; align-items:center; gap:8px; }
  .btn-refresh{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);
    color:#fff;
    padding:6px 11px;
    border-radius:7px;
    font-size:11px;
    font-weight:700;
    cursor:pointer;
    display:flex; align-items:center; gap:5px;
  }
  .btn-refresh:hover{ background:rgba(255,255,255,.15); }
  .btn-refresh svg{ width:12px; height:12px; }
  .btn-refresh.spinning svg{ animation:spin .7s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .console-body{
    flex:1 1 auto;
    min-height:0;
    display:flex;
    flex-direction:column;
    max-width:1500px;
    width:100%;
    margin:0 auto;
    padding:10px 16px 12px;
  }

  /* ---------- Diagnostic banner ---------- */
  .diag-banner{
    display:none;
    flex:0 0 auto;
    background:#fff7ed;
    border:1px solid #fed7aa;
    color:#9a3412;
    padding:7px 12px;
    border-radius:9px;
    font-size:11px;
    font-weight:600;
    margin-bottom:8px;
    align-items:center;
    gap:7px;
  }
  .diag-banner.show{ display:flex; }

  /* ---------- Filter bar ---------- */
  .filter-bar{
    flex:0 0 auto;
    background:var(--card);
    padding:10px 12px;
    border-radius:12px;
    border:1px solid var(--line);
    box-shadow:0 1px 2px rgba(15,23,42,.04);
    margin-bottom:8px;
  }
  .filter-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(170px, 1fr));
    gap:8px;
    margin-bottom:8px;
  }
  .filter-grid label{
    display:block; font-size:9px; font-weight:700; text-transform:uppercase;
    letter-spacing:.4px; color:var(--slate-soft); margin-bottom:3px;
  }
  .filter-grid select, .filter-grid input{
    width:100%; height:32px; padding:6px 10px; border:1px solid var(--line); border-radius:8px;
    font-size:12px; font-family:inherit; background:#f8fafc; color:var(--ink);
    transition:border-color .15s ease, background .15s ease;
  }
  .filter-grid select:focus, .filter-grid input:focus{
    outline:none; border-color:var(--signal); background:#fff;
  }
  .search-wrap{ position:relative; }
  .search-wrap input{ padding-left:28px; }
  .search-wrap svg{ position:absolute; left:9px; top:50%; transform:translateY(-50%); width:12px; height:12px; color:var(--slate-soft); }

  .pipeline-row{
    display:flex; flex-wrap:wrap; align-items:center; gap:8px;
    padding-top:8px; border-top:1px dashed var(--line);
  }
  .pipeline-label{ font-size:9px; font-weight:700; text-transform:uppercase; color:var(--slate-soft); letter-spacing:.4px; margin-right:1px; }
  .btn-export{
    padding:6px 12px; border-radius:999px; border:none; font-weight:700; font-size:10.5px;
    cursor:pointer; color:#fff; display:inline-flex; align-items:center; gap:5px;
    transition:transform .12s ease, filter .12s ease;
  }
  .btn-export:hover{ filter:brightness(1.06); }
  .btn-export:active{ transform:scale(.97); }
  .btn-export svg{ width:11px; height:11px; }
  .btn-center{ background:var(--emerald); }
  .btn-tech{ background:var(--teal); }
  .btn-excel{ background:var(--signal); }
  .active-filter-pill{
    margin-left:auto; font-size:10.5px; color:var(--slate); font-weight:600;
  }
  .active-filter-pill b{ color:var(--ink); font-family:var(--mono); }

  /* ---------- Table card ---------- */
  .admin-table-card{
    flex:1 1 auto;
    min-height:0;
    display:flex;
    flex-direction:column;
    background:var(--card); border-radius:12px; border:1px solid var(--line);
    box-shadow:0 1px 2px rgba(15,23,42,.04); overflow:hidden;
  }
  .table-meta{
    flex:0 0 auto;
    padding:8px 12px; background:#f8fafc; border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center; font-size:11.5px;
    font-weight:600; color:var(--slate);
  }

  .table-scroll{ flex:1 1 auto; min-height:0; overflow:auto; width:100%; position:relative; }
  .admin-table{ width:100%; border-collapse:separate; border-spacing:0; font-size:11px; text-align:left; }
  .admin-table thead th{
    position:sticky; top:0; z-index:2;
    background:var(--ink); color:#fff; padding:7px 10px; font-weight:600;
    text-transform:uppercase; font-size:9px; letter-spacing:.4px; white-space:nowrap;
  }
  .admin-table tbody tr{ transition:background .1s ease; }
  .admin-table tbody tr:nth-child(even){ background:#fafbfc; }
  .admin-table tbody tr:hover{ background:#eff6ff; }
  .admin-table td{
    padding:6px 10px; border-bottom:1px solid var(--line); white-space:nowrap;
    max-width:170px; overflow:hidden; text-overflow:ellipsis;
  }
  .cell-code{ font-family:var(--mono); font-size:10.5px; color:var(--ink); }

  .hostname-cell{ display:flex; align-items:center; gap:5px; }
  .hostname-cell .cell-code{ overflow:hidden; text-overflow:ellipsis; }
  .btn-copy-icon{
    flex:0 0 auto; width:19px; height:19px; border-radius:5px; border:1px solid #dbeafe;
    background:#eff6ff; color:var(--signal); display:flex; align-items:center; justify-content:center;
    cursor:pointer; padding:0; transition:background .12s ease, transform .1s ease;
  }
  .btn-copy-icon:hover{ background:#dbeafe; }
  .btn-copy-icon:active{ transform:scale(.9); }
  .btn-copy-icon svg{ width:10px; height:10px; }
  .btn-copy-icon.copied{ background:var(--emerald); border-color:var(--emerald); color:#fff; }

  /* Key Status button (column J) */
  .btn-keystatus{
    border:none; border-radius:999px; padding:4px 11px; font-size:10.5px; font-weight:700;
    cursor:pointer; font-family:var(--sans); min-width:56px; text-align:center;
    transition:filter .12s ease, transform .1s ease;
  }
  .btn-keystatus:active{ transform:scale(.95); }
  .btn-keystatus:disabled{ opacity:.6; cursor:wait; }
  .btn-keystatus.status-no{ background:#f1f5f9; color:var(--slate); border:1px solid var(--line); }
  .btn-keystatus.status-yes{ background:var(--emerald); color:#fff; }
  .btn-keystatus:hover:not(:disabled){ filter:brightness(1.05); }
  .btn-spinner{
    display:inline-block; width:10px; height:10px; border:2px solid rgba(0,0,0,.2);
    border-top-color:currentColor; border-radius:50%; animation:spin .6s linear infinite;
  }

  .empty-state, .loading-state{ text-align:center; padding:36px 20px; color:var(--slate-soft); font-size:12px; }
  .loading-state .spinner{
    width:20px; height:20px; border:3px solid var(--line); border-top-color:var(--signal);
    border-radius:50%; margin:0 auto 8px; animation:spin .8s linear infinite;
  }

  /* ---------- Pagination ---------- */
  .pagination-bar{
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:7px 12px; border-top:1px solid var(--line); background:#f8fafc; flex-wrap:wrap;
  }
  .pg-info{ font-size:10.5px; color:var(--slate); font-weight:600; }
  .pg-info b{ color:var(--ink); }
  .pg-controls{ display:flex; align-items:center; gap:5px; }
  .pg-btn{
    width:24px; height:24px; border-radius:6px; border:1px solid var(--line); background:#fff;
    cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--slate);
    transition:background .12s ease, color .12s ease;
  }
  .pg-btn:hover:not(:disabled){ background:#eff6ff; color:var(--signal); border-color:#bfdbfe; }
  .pg-btn:disabled{ opacity:.35; cursor:not-allowed; }
  .pg-btn svg{ width:11px; height:11px; }
  .pg-pagenum{ font-size:10.5px; font-weight:700; color:var(--ink); padding:0 5px; font-family:var(--mono); }
  .pg-size select{
    padding:4px 7px; border-radius:6px; border:1px solid var(--line); font-size:10.5px;
    font-family:inherit; background:#fff; color:var(--slate);
  }

  /* ---------- Auth overlay ---------- */
  .auth-overlay{
    position:fixed; inset:0; background:rgba(15,23,42,.9); backdrop-filter:blur(2px);
    display:flex; align-items:center; justify-content:center; z-index:99999;
  }
  .auth-modal{
    background:#fff; padding:26px; border-radius:16px; width:100%; max-width:340px;
    box-shadow:0 20px 40px -10px rgba(0,0,0,.25);
  }
  .auth-modal .badge{
    width:38px; height:38px; border-radius:10px; background:var(--ink); color:#fff;
    display:flex; align-items:center; justify-content:center; margin:0 auto 12px;
  }
  .auth-modal h2{ font-size:16px; font-weight:800; margin:0 0 4px; color:var(--ink); text-align:center; }
  .auth-modal p.sub{ font-size:11.5px; color:var(--slate-soft); text-align:center; margin:0 0 16px; }
  .auth-field{ margin-bottom:11px; }
  .auth-field label{ display:block; font-size:10.5px; font-weight:600; color:var(--slate); margin-bottom:4px; }
  .auth-field input{ width:100%; padding:8px 11px; border:1px solid var(--line); border-radius:8px; font-size:12.5px; font-family:inherit; }
  .auth-field input:focus{ outline:none; border-color:var(--signal); }
  .auth-error{ font-size:11px; color:var(--rose); font-weight:600; min-height:13px; margin:-4px 0 8px; }
  .btn-auth-submit{
    width:100%; padding:9px; background:var(--signal); color:#fff; border:none; border-radius:8px;
    font-weight:700; font-size:12.5px; cursor:pointer; margin-top:4px; transition:background .12s ease;
  }
  .btn-auth-submit:hover{ background:var(--signal-dark); }
  .dashboard-wrapper{ display:none; flex-direction:column; flex:1 1 auto; min-height:0; }

  @media (max-width: 720px){
    html, body{ overflow:auto; }
    .console-bar{ flex-direction:column; align-items:flex-start; gap:8px; }
    .console-stats{ flex-wrap:wrap; }
    .table-scroll{ max-height:56vh; }
    .dashboard-wrapper{ height:auto; }
  }
</style>
</head>
<body>

<div id="headerPlaceholder"></div>

<!-- Admin Login Panel Gate -->
<div id="adminAuthBlock" class="auth-overlay">
  <div class="auth-modal">
    <div class="badge">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z"/></svg>
    </div>
    <h2>Admin Console Access</h2>
    <p class="sub">Sign in to view the netboot operations matrix</p>
    <div class="auth-field">
      <label>Username</label>
      <input type="text" id="authAdminUser" placeholder="Enter administrative username" autocomplete="off" />
    </div>
    <div class="auth-field">
      <label>Password</label>
      <input type="password" id="authAdminPass" placeholder="Enter security access password" />
    </div>
    <div class="auth-error" id="authErrorMsg"></div>
    <button class="btn-auth-submit" onclick="executeLocalPortalAuth()">Verify credentials</button>
  </div>
</div>

<!-- Main UI Working Workspace Layout -->
<div id="adminDashboardView" class="dashboard-wrapper">

  <div class="console-bar">
    <div class="console-brand"><span class="dot"></span> Netboot Operations Console</div>
    <div class="console-stats">
      <div class="console-chip">Loaded <b id="statLoaded">0</b></div>
      <div class="console-chip">Filtered <b id="statFiltered">0</b></div>
    </div>
    <div class="console-actions">
      <button class="btn-refresh" id="btnRefresh" onclick="loadMasterGrid()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.36-3.36L23 10M1 14l5.13 4.36A9 9 0 0020.49 15"/></svg>
        Refresh
      </button>
    </div>
  </div>

  <div class="console-body">

    <div class="diag-banner" id="diagBanner">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 9v4M12 17h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>
      <span id="diagBannerText"></span>
    </div>

    <!-- Dynamic Filters & Pipelines Frame -->
    <div class="filter-bar">
      <div class="filter-grid">
        <div>
          <label>Filter by exam</label>
          <select id="admFilterExam" onchange="onFilterChange()"><option value="">— All exams —</option></select>
        </div>
        <div>
          <label>Filter by city</label>
          <select id="admFilterCity" onchange="onFilterChange()"><option value="">— All cities —</option></select>
        </div>
        <div>
          <label>Global search</label>
          <div class="search-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input type="text" id="admFilterSearch" oninput="onSearchInput()" placeholder="Search hostname, center, tech, mobile…"/>
          </div>
        </div>
      </div>

      <div class="pipeline-row">
        <span class="pipeline-label">Export:</span>
        <button onclick="exportCenterCSV()" class="btn-export btn-center">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          Centers profile
        </button>
        <button onclick="exportTechCSV()" class="btn-export btn-tech">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          Tech contacts
        </button>
        <button onclick="exportMasterExcel()" class="btn-export btn-excel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          Full ledger (.xlsx)
        </button>
        <span class="active-filter-pill" id="activeFilterPill"></span>
      </div>
    </div>

    <!-- Interactive Matrix Component Table -->
    <div class="admin-table-card">
      <div class="table-meta">
        <div>Operational matrix — <span id="counterValue" style="color:var(--signal);font-weight:800;">0</span> records matching</div>
      </div>

      <div class="table-scroll">
        <table class="admin-table">
          <thead id="admHeaders"></thead>
          <tbody id="admBody">
            <tr class="loading-state"><td colspan="10"><div class="spinner"></div>Loading records…</td></tr>
          </tbody>
        </table>
      </div>

      <div class="pagination-bar" id="paginationBar" style="display:none;">
        <div class="pg-info">Showing <b id="pgRangeStart">0</b>–<b id="pgRangeEnd">0</b> of <b id="pgTotal">0</b></div>
        <div class="pg-controls">
          <button class="pg-btn" id="pgFirst" onclick="goToPage(1)" title="First page">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M18 17l-5-5 5-5M11 17l-5-5 5-5"/></svg>
          </button>
          <button class="pg-btn" id="pgPrev" onclick="goToPage(currentPage-1)" title="Previous page">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <span class="pg-pagenum" id="pgPageLabel">1 / 1</span>
          <button class="pg-btn" id="pgNext" onclick="goToPage(currentPage+1)" title="Next page">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M9 18l6-6-6-6"/></svg>
          </button>
          <button class="pg-btn" id="pgLast" onclick="goToPage(totalPages)" title="Last page">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 17l5-5-5-5M13 17l5-5-5-5"/></svg>
          </button>
        </div>
        <div class="pg-size">
          <select id="pgSizeSelect" onchange="onPageSizeChange()">
            <option value="25">25 / page</option>
            <option value="50" selected>50 / page</option>
            <option value="100">100 / page</option>
            <option value="250">250 / page</option>
          </select>
        </div>
      </div>
    </div>

  </div>
</div>

<div id="toast"></div>
<div id="footerPlaceholder"></div>

<script src="common.js"></script>
<script src="app.js"></script>
</body>
</html>
